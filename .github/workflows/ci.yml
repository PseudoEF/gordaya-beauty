name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node 24 / test / lint / build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Prepare temporary database
        run: |
          echo "DATABASE_URL=file:$RUNNER_TEMP/gordaya-ci.db" >> "$GITHUB_ENV"
          npm run db:init

      - name: Production build
        env:
          ADMIN_PASSWORD: ci-only-password
          SESSION_SECRET: ci-only-session-secret-at-least-32-characters
          SESSION_COOKIE_SECURE: "false"
        run: npm run build
